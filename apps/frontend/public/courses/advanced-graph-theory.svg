<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle hex grid decoration -->
  <g stroke="white" stroke-width="0.5" opacity="0.06">
    <circle cx="400" cy="252" r="190"/>
    <circle cx="400" cy="252" r="130"/>
    <circle cx="400" cy="252" r="70"/>
  </g>

  <!-- Hub coordinates: (400,252) -->
  <!-- Ring (r=160): N1(400,92) N2(539,172) N3(539,332) N4(400,412) N5(261,332) N6(261,172) -->

  <!-- Spoke edges: hub → ring -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2.5">
    <line x1="400" y1="252" x2="400" y2="92"/>
    <line x1="400" y1="252" x2="539" y2="172"/>
    <line x1="400" y1="252" x2="539" y2="332"/>
    <line x1="400" y1="252" x2="400" y2="412"/>
    <line x1="400" y1="252" x2="261" y2="332"/>
    <line x1="400" y1="252" x2="261" y2="172"/>
  </g>

  <!-- Ring cycle edges -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="2.5">
    <line x1="400" y1="92"  x2="539" y2="172"/>
    <line x1="539" y1="172" x2="539" y2="332"/>
    <line x1="539" y1="332" x2="400" y2="412"/>
    <line x1="400" y1="412" x2="261" y2="332"/>
    <line x1="261" y1="332" x2="261" y2="172"/>
    <line x1="261" y1="172" x2="400" y2="92"/>
  </g>

  <!-- Hub glow -->
  <circle cx="400" cy="252" r="42" fill="white" opacity="0.15"/>

  <!-- Hub node — rose/coral (needs 3rd colour) -->
  <circle cx="400" cy="252" r="28" fill="#fb7185"/>
  <circle cx="400" cy="252" r="14" fill="#9f1239"/>

  <!-- Ring node halos -->
  <g opacity="0.18" fill="white">
    <circle cx="400" cy="92"  r="38"/>
    <circle cx="539" cy="172" r="38"/>
    <circle cx="539" cy="332" r="38"/>
    <circle cx="400" cy="412" r="38"/>
    <circle cx="261" cy="332" r="38"/>
    <circle cx="261" cy="172" r="38"/>
  </g>

  <!-- Ring nodes alternating sky / emerald -->
  <circle cx="400" cy="92"  r="26" fill="#38bdf8"/>
  <circle cx="539" cy="172" r="26" fill="#34d399"/>
  <circle cx="539" cy="332" r="26" fill="#38bdf8"/>
  <circle cx="400" cy="412" r="26" fill="#34d399"/>
  <circle cx="261" cy="332" r="26" fill="#38bdf8"/>
  <circle cx="261" cy="172" r="26" fill="#34d399"/>

  <!-- Ring node inner dots -->
  <circle cx="400" cy="92"  r="12" fill="#0369a1"/>
  <circle cx="539" cy="172" r="12" fill="#065f46"/>
  <circle cx="539" cy="332" r="12" fill="#0369a1"/>
  <circle cx="400" cy="412" r="12" fill="#065f46"/>
  <circle cx="261" cy="332" r="12" fill="#0369a1"/>
  <circle cx="261" cy="172" r="12" fill="#065f46"/>
</svg>
